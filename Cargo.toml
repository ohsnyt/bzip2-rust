[package]
name = "bzip2-os"
version = "0.5.0"
edition = "2021"
description = "A pure-Rust multi-threaded implementation of bzip2 compression."
license = "MIT OR Apache-2.0"
authors = ["david.snyder@stillwaiting.org"]
repository = "https://github.com/ohsnyt/bzip2"
keywords = ["compression", "bzip2", "rust"]

[dependencies]
log = {version = "^0.4.17", features = ["release_max_level_trace"]}
simplelog = { version = "^0.12.0", features = ["paris"] }
rayon = "^1.6.0"

[profile.release]
debug = true
lto = true
codegen-units = 1